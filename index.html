<style>
:root{--bg:#fff;--ink:#111;--sub:#777;--ph:#f3f3f3;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;max-width:560px;margin:0 auto}
.addtop{border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;padding:8px 14px;cursor:pointer}
h1{font-size:18px;font-weight:600;margin:0}
main{padding:0 18px 130px;max-width:560px;margin:0 auto}
.card{padding:0;scroll-margin-top:calc(76px + env(safe-area-inset-top,0px));scroll-margin-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--sub)}
.dt{color:var(--ink);font-size:15px;font-weight:600}
.x.ar{order:-1;margin-right:10px}
.card.min{padding-bottom:12px}
.card.min .row{margin-bottom:0}
.x{min-width:30px;height:28px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-size:14px;padding:0 8px;cursor:pointer}
.x.ask{background:var(--ink);color:var(--bg);font-size:12px}
.wrap{position:relative}
.row3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.grp{margin-bottom:14px;scroll-margin-top:calc(76px + env(safe-area-inset-top,0px));scroll-margin-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.gh{display:flex;align-items:center;justify-content:flex-end;gap:10px;border-top:1px solid var(--ink);padding-top:8px;margin-bottom:10px}
.gl{font-size:13px;color:var(--sub)}
.view{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:7;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(100px + env(safe-area-inset-bottom,0px))}
.view.on{display:flex}
.view img{max-width:100%;max-height:100%;object-fit:contain}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.vbar button{flex:1;padding:14px 0;border-radius:12px;border:0;background:#fff;color:#111;font-family:inherit;font-size:15px;cursor:pointer}
.vbar .ask{background:#111;color:#fff;outline:2px solid #fff}
.dn{border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-size:12px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.dn.on{background:var(--ink);color:var(--bg)}
.dn.ask{background:var(--ink);color:var(--bg)}
.hbt{display:flex;gap:8px}
h1{white-space:nowrap}
.photo{position:relative}
.selmode .photo::after{content:"";position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:var(--bg)}
.card.pk .photo{outline:3px solid var(--ink);outline-offset:-3px}
.card.pk .photo::after{content:"\2713";display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);font-size:14px;line-height:1}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.dlg.on{display:flex}
.dbox{background:var(--bg);color:var(--ink);border:1px solid var(--ink);padding:24px 18px 16px;width:100%;max-width:320px}
.dbox p{margin:0 0 20px;font-size:16px;text-align:center}
.drow{display:flex;gap:8px}
.drow button{flex:1;padding:12px 0;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-size:15px;cursor:pointer}
.drow .y{background:var(--ink);color:var(--bg)}
.btns{display:flex;gap:4px}
.lab{margin:5px 0 0;font-size:13px}
.photo{display:block;width:100%;aspect-ratio:5/4;border:1px solid var(--ink);background:var(--ph);padding:0;overflow:hidden;cursor:pointer;color:var(--sub);font-family:inherit;font-size:15px;border-radius:0}
.photo.none{border-style:dashed;color:var(--ink);font-size:28px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.seg{position:absolute;left:10px;top:10px;display:flex;border:1px solid var(--ink);background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:14px;padding:6px 16px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button+button{border-left:1px solid var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.empty{text-align:center;color:var(--sub);margin-top:90px;font-size:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ink);z-index:4}
.tabs .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;border-radius:18px;background:transparent;color:var(--sub);font-family:inherit;font-size:12px;font-weight:600;padding:10px 0;cursor:pointer}
.tabs .t.on{color:var(--ink);background:rgba(128,128,128,.2)}
.add{flex:none;width:50px;height:50px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:30px;line-height:1;padding:0;cursor:pointer}
.choose{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:8}
.choose.on{display:flex}
.choose .box{width:100%;max-width:560px;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.choose button{padding:15px 0;border-radius:14px;border:0;background:#fff;color:#111;font-family:inherit;font-size:17px;cursor:pointer}
.choose button.c{font-weight:600}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;display:none;z-index:9;white-space:nowrap}
</style>
</head>
<body>
<header><h1 id="ttl">스티커 도감</h1><div class="hbt" id="hn"><button class="addtop" id="selbtn">선택</button><button class="addtop" id="add" aria-label="추가">+ 추가</button></div><div class="hbt" id="hs" style="display:none"><button class="addtop" id="s-all">전체</button><button class="addtop" id="s-x">취소</button><button class="addtop" id="s-del">삭제</button></div></header>
<main>
  <div id="list"></div>
  <div class="empty" id="empty"></div>
</main>
<nav class="tabs">
  <button class="t on" id="t-doing"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="l-doing">진행 중</span></button>
  <button class="t" id="t-done"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span id="l-done">완성</span></button>
  <button class="t" id="bk"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>백업</span></button>
</nav>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div class="choose" id="choose"><div class="box"><button id="c-cam">사진 찍기</button><button id="c-lib">앨범에서 선택</button><button id="c-del" style="display:none">이 칸 지우기</button><button id="c-x" class="c">취소</button></div></div>
<input type="file" id="bkfile" accept=".json,application/json" hidden>
<div class="choose" id="bksheet"><div class="box"><button id="b-save">백업 저장</button><button id="b-load">백업 불러오기</button><button id="b-x" class="c">닫기</button></div></div>
<div class="view" id="view" role="dialog" aria-modal="true"><img id="vimg" alt="스티커 사진"><div class="vbar"><button id="v-change">사진 바꾸기</button><button id="v-del">삭제</button><button id="v-x">닫기</button></div></div>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true"><div class="dbox"><p id="dmsg">삭제하시겠습니까?</p><div class="drow"><button id="d-no">취소</button><button id="d-yes" class="y">삭제</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var items=[],db=null,target=null,tab='doing',vrec=null,sel=false,picked=[];
  var closedG={};try{closedG=JSON.parse(localStorage.getItem('stk-closed')||'{}')||{}}catch(e){closedG={}}
  function saveClosed(){try{localStorage.setItem('stk-closed',JSON.stringify(closedG))}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var list=$('list'),file=$('file');

  function toast(t){var el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display='none'},2400)}

  function openDB(){return new Promise(function(res,rej){
    try{var r=indexedDB.open('sticker-keeper',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true})};
      r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}})}
  function st(m){return db.transaction('photos',m).objectStore('photos')}
  function loadAll(){return new Promise(function(res){
    if(!db){res([]);return}
    try{var q=st('readonly').getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}})}
  function put(rec){return new Promise(function(res){
    var fb=function(){if(!rec.id)rec.id=Date.now()+Math.random();res(rec)};
    if(!db){fb();return}
    try{var q=st('readwrite').put(rec);q.onsuccess=function(){rec.id=q.result;res(rec)};q.onerror=fb}catch(e){fb()}})}
  function remove(id){return new Promise(function(res){
    if(!db||!id){res();return}
    try{var q=st('readwrite').delete(id);q.onsuccess=q.onerror=function(){res()}}catch(e){res()}})}

  function scale(src,m,q){return new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){
      var s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q));
    };
    im.onerror=function(){rej()};
    im.src=src;
  })}
  function shrink(f){var url=URL.createObjectURL(f);return scale(url,1280,0.82).then(function(r){URL.revokeObjectURL(url);return r},function(e){URL.revokeObjectURL(url);throw e})}
  function makeThumb(src){return scale(src,420,0.75).catch(function(){return null})}

  function p2(n){return n<10?'0'+n:''+n}
  function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}
  function norm(r){
    if(!r.photo)r.photo=r.after||r.before||r.src||null;
    if(typeof r.done!=='boolean')r.done=!!r.after;
    if(!r.t)r.t=Date.now();
    return r;
  }
  async function fillThumbs(){
    var ch=false;
    for(var i=0;i<items.length;i++){
      var r=items[i];
      if(r.photo&&!r.thumb){var t=await makeThumb(r.photo);if(t){r.thumb=t;await put(r);ch=true}}
    }
    if(ch)render();
  }

  function openChoose(canDel){$('c-del').style.display=canDel?'block':'none';$('choose').classList.add('on')}
  function openView(rec){vrec=rec;$('vimg').src=rec.photo;var d=$('v-del');d.classList.remove('ask');d.textContent='삭제';$('view').classList.add('on')}
  function closeView(){$('view').classList.remove('on');vrec=null;$('vimg').removeAttribute('src')}

  function updHeader(){
    $('hn').style.display=sel?'none':'flex';$('hs').style.display=sel?'flex':'none';
    $('ttl').textContent=sel?(picked.length+'개 선택'):'스티커 도감';
  }
  function askDel(msg){return new Promise(function(res){
    $('dmsg').textContent=msg;$('dlg').classList.add('on');
    function done(v){$('dlg').classList.remove('on');$('dlg').onclick=null;$('d-yes').onclick=null;$('d-no').onclick=null;res(v)}
    $('d-yes').onclick=function(){done(true)};
    $('d-no').onclick=function(){done(false)};
    $('dlg').onclick=function(e){if(e.target===this)done(false)};
  })}
  function render(){
    list.innerHTML='';list.className=sel?'selmode':'';updHeader();
    var order=items.slice().sort(function(a,b){return a.t-b.t});
    var vis=items.filter(function(r){return tab==='done'?r.done:!r.done}).sort(function(a,b){return a.t-b.t});
    function buildCard(rec){
      var c=mk('div','card'),row=mk('div','row');
      row.appendChild(mk('span','dt',String(order.indexOf(rec)+1)));
      var dn=mk('button','dn'+(rec.done?' on':''),'완성');
      dn.setAttribute('aria-pressed',rec.done?'true':'false');
      dn.setAttribute('aria-label',rec.done?'완성 취소':'완성으로 표시');
      dn.onclick=async function(){
        if(!rec.photo){toast('사진을 먼저 넣어 주세요');return}
        rec.done=!rec.done;await put(rec);render();
        toast(rec.done?'완성! 완성 탭으로 옮겼어요':'진행 중으로 되돌렸어요');
      };
      if(!rec.photo){dn=mk('button','dn','×');dn.setAttribute('aria-label','이 칸 지우기');dn.onclick=function(){items=items.filter(function(q){return q!==rec});render()}}
      var bt=mk('div','btns');bt.appendChild(dn);
      if(rec.photo){var xb=mk('button','dn','×');xb.setAttribute('aria-label','삭제');xb.onclick=async function(){if(!(await askDel('삭제하시겠습니까?')))return;await remove(rec.id);items=items.filter(function(q){return q!==rec});render()};bt.appendChild(xb)}
      if(!sel)row.appendChild(bt);c.appendChild(row);if(sel&&picked.indexOf(rec)>=0)c.className='card pk';
      var p=mk('button','photo'+(rec.photo?'':' none'));
      p.setAttribute('aria-label',rec.photo?'사진 크게 보기':'사진 추가');
      if(rec.photo){var im=document.createElement('img');im.src=rec.thumb||rec.photo;im.alt='스티커 사진';p.appendChild(im);p.onclick=function(){openView(rec)}}
      else{p.textContent='+';p.onclick=function(){target={rec:rec};file.click()}}
      if(sel){p.onclick=function(){var i=picked.indexOf(rec);if(i>=0)picked.splice(i,1);else picked.push(rec);render()}}
      c.appendChild(p);return c;
    }
    for(var gi=0;gi<vis.length;gi+=2){
      var chunk=vis.slice(gi,gi+2),key=tab+':'+chunk[0].t,closed=!!closedG[key];
      var g=mk('div','grp'),gh=mk('div','gh');
      var ab=mk('button','x',closed?'\u25b8':'\u25be');
      ab.setAttribute('aria-label',closed?'펼치기':'접기');ab.setAttribute('aria-expanded',closed?'false':'true');
      ab.onclick=(function(k){return function(){if(closedG[k])delete closedG[k];else closedG[k]=1;saveClosed();render()}})(key);
      gh.appendChild(ab);
      
      g.appendChild(gh);
      if(!closed){var r3=mk('div','row3');chunk.forEach(function(rec){r3.appendChild(buildCard(rec))});g.appendChild(r3)}
      list.appendChild(g);
    }
    var nd=items.filter(function(r){return !r.done}).length,nf=items.length-nd;
    $('l-doing').textContent='진행 중 '+nd;$('l-done').textContent='완성 '+nf;
    $('t-doing').className='t'+(tab==='doing'?' on':'');$('t-done').className='t'+(tab==='done'?' on':'');
    $('empty').textContent=tab==='done'?'완성된 스티커가 여기에 모여요':'+ 추가 버튼으로 시작해요';
    $('empty').style.display=(tab==='done'?nf:nd)?'none':'block';
  }

  $('add').onclick=function(){tab='doing';items.push({photo:null,done:false,t:Date.now()});
    var v2=items.filter(function(r){return !r.done}).sort(function(a,b){return a.t-b.t});
    delete closedG['doing:'+v2[Math.floor((v2.length-1)/2)*2].t];saveClosed();render();(function(){var lc=list.lastElementChild;if(lc)lc.scrollIntoView({block:'nearest'})})()};

  async function doBackup(){
    var data=items.filter(function(r){return r.photo}).map(function(r){return {photo:r.photo,done:!!r.done,t:r.t}});
    if(!data.length){toast('백업할 스티커가 없어요');return}
    var d=new Date(),name='sticker-backup-'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'.json';
    try{var bl=new Blob([JSON.stringify({app:'sticker',v:2,items:data})],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u)},1500);toast('백업을 저장했어요')}
    catch(e){toast('백업 저장에 실패했어요')}
  }
  async function doRestore(f){
    try{
      var j=JSON.parse(await f.text());
      if(!j||j.app!=='sticker'||!Array.isArray(j.items))throw 0;
      var ok=function(s){return typeof s==='string'&&s.indexOf('data:image/')===0?s:null};
      var key=function(r){return r.t+'|'+(r.photo?r.photo.length:0)};
      var have={};items.forEach(function(r){have[key(r)]=1});
      var n=0;
      for(var k=0;k<j.items.length;k++){
        var r=j.items[k]||{};
        var rec={photo:ok(r.photo)||ok(r.after)||ok(r.before),done:typeof r.done==='boolean'?r.done:!!r.after,t:+r.t||Date.now()};
        if(!rec.photo)continue;
        if(have[key(rec)])continue;
        await put(rec);items.push(rec);have[key(rec)]=1;n++;
      }
      render();toast(n?n+'개 복원했어요':'새로 복원할 스티커가 없어요');
      fillThumbs();
    }catch(e){toast('백업 파일을 읽지 못했어요')}
  }
  async function onPick(inp){
    var f=inp.files&&inp.files[0];inp.value='';
    if(!f||!target)return;
    var tg=target;
    try{
      tg.rec.photo=await shrink(f);
      tg.rec.thumb=await makeThumb(tg.rec.photo);
      await put(tg.rec);render();
      if(vrec===tg.rec)$('vimg').src=tg.rec.photo;
    }catch(e){toast('사진을 불러오지 못했어요. 다시 선택해 주세요')}
  }
  file.onchange=function(){onPick(file)};
  $('cam').onchange=function(){onPick($('cam'))};
  $('c-cam').onclick=function(){$('choose').classList.remove('on');$('cam').click()};
  $('c-lib').onclick=function(){$('choose').classList.remove('on');file.click()};
  $('c-x').onclick=function(){$('choose').classList.remove('on')};
  $('c-del').onclick=async function(){
    $('choose').classList.remove('on');
    if(!target)return;
    var r=target.rec;await remove(r.id);items=items.filter(function(q){return q!==r});render();
  };
  $('choose').onclick=function(e){if(e.target===this)this.classList.remove('on')};

  $('v-x').onclick=closeView;
  $('view').onclick=function(e){if(e.target===this)closeView()};
  $('v-change').onclick=function(){if(!vrec)return;target={rec:vrec};file.click()};
  $('v-del').onclick=async function(){
    if(!vrec)return;
    if(!(await askDel('삭제하시겠습니까?')))return;
    var r=vrec;await remove(r.id);items=items.filter(function(q){return q!==r});closeView();render();
  };

  $('t-doing').onclick=function(){tab='doing';sel=false;picked=[];render()};
  $('t-done').onclick=function(){tab='done';sel=false;picked=[];render()};
  $('selbtn').onclick=function(){sel=true;picked=[];render()};
  $('s-x').onclick=function(){sel=false;picked=[];render()};
  $('s-all').onclick=function(){var vis=items.filter(function(r){return tab==='done'?r.done:!r.done});picked=picked.length===vis.length?[]:vis.slice();render()};
  $('s-del').onclick=async function(){
    if(!picked.length){toast('삭제할 스티커를 선택해 주세요');return}
    if(!(await askDel(picked.length+'개를 삭제하시겠습니까?')))return;
    var ps=picked.slice();
    for(var i=0;i<ps.length;i++){await remove(ps[i].id)}
    items=items.filter(function(q){return ps.indexOf(q)<0});
    sel=false;picked=[];render();toast(ps.length+'개 삭제했어요');
  };
  $('bk').onclick=function(){$('bksheet').classList.add('on')};
  $('b-x').onclick=function(){$('bksheet').classList.remove('on')};
  $('bksheet').onclick=function(e){if(e.target===this)this.classList.remove('on')};
  $('b-save').onclick=function(){$('bksheet').classList.remove('on');doBackup()};
  $('b-load').onclick=function(){$('bksheet').classList.remove('on');$('bkfile').click()};
  $('bkfile').onchange=function(){var f=this.files&&this.files[0];this.value='';if(f)doRestore(f)};

  openDB().then(function(d){db=d}).catch(function(){db=null;setTimeout(function(){toast('이 브라우저에서는 사진이 저장되지 않아요')},500)})
  .then(loadAll).then(function(a){items=a.map(norm);render();fillThumbs()});
})();
</script>
</body>
</html>
